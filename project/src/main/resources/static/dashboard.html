<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .topbar {
            background: #1f2937;
            color: white;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            font-size: 13px;
            color: #d1d5db;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #6b7280;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .logout:hover {
            background: #374151;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .welcome h2 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 28px;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .section-content {
            padding: 22px;
        }

        .refresh-button,
        .save-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .refresh-button:hover,
        .save-button:hover {
            background: #1d4ed8;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .config-card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .config-card h4 {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .config-row {
            margin-bottom: 16px;
        }

        .config-label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #6b7280;
            margin-bottom: 6px;
        }

        .response-input {
            width: 100%;
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }

        .response-input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .save-status {
            margin-left: 10px;
            font-size: 13px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 12px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .command {
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-status {
            background: #dcfce7;
            color: #166534;
        }

        .badge-report {
            background: #dbeafe;
            color: #1e40af;
        }

        .action {
            color: #4b5563;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            padding: 16px;
            color: #b91c1c;
            background: #fee2e2;
            margin: 20px;
            border-radius: 6px;
        }

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .config-grid {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 16px 20px;
            }

            .topbar h1 {
                font-size: 18px;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .status {
                display: none;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <h1>Discord Admin Dashboard</h1>

    <div class="topbar-right">

        <span class="status" id="lastUpdated">
            Loading...
        </span>

        <a class="logout" href="/logout">
            Logout
        </a>

    </div>

</header>


<main class="container">

    <!-- PAGE INTRO -->
    <div class="welcome">

        <h2>Command Activity</h2>

        <p>
            Monitor Discord commands, actions, and command configuration.
        </p>

    </div>


    <!-- SUMMARY CARDS -->
    <section class="cards">

        <div class="card">

            <div class="card-title">
                Total Commands
            </div>

            <div class="card-value" id="totalCommands">
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Reports
            </div>

            <div class="card-value" id="reportCount">
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Status Checks
            </div>

            <div class="card-value" id="statusCount">
                0
            </div>

        </div>

    </section>


    <!-- COMMAND CONFIGURATION -->
    <section class="section">

        <div class="section-header">

            <h3>
                Command Configuration
            </h3>

            <button
                    class="refresh-button"
                    onclick="loadConfigs()">
                Refresh
            </button>

        </div>

        <div
                id="configContainer"
                class="section-content">

            Loading configuration...

        </div>

    </section>


    <!-- COMMAND LOGS -->
    <section class="section">

        <div class="section-header">

            <h3>
                Command Logs
            </h3>

            <button
                    class="refresh-button"
                    onclick="loadLogs()">
                Refresh
            </button>

        </div>

        <div id="message"></div>

        <div class="table-container">

            <table>

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Command</th>

                    <th>User</th>

                    <th>Channel</th>

                    <th>Text</th>

                    <th>Action Taken</th>

                    <th>Time</th>

                </tr>

                </thead>

                <tbody id="logs">

                </tbody>

            </table>

        </div>

    </section>

</main>


<script>

    /*
     * Prevent HTML/JavaScript injection
     * when displaying values received from the backend.
     */
    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }


    /*
     * Format timestamp
     */
    function formatDate(value) {

        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString();
    }


    /*
     * Load command logs
     */
    async function loadLogs() {

        const table = document.getElementById("logs");
        const message = document.getElementById("message");

        message.innerHTML = "";

        try {

            const response =
                await fetch("/api/admin/logs");

            if (!response.ok) {
                throw new Error("Failed to load logs");
            }

            const logs = await response.json();


            /*
             * Update summary cards
             */

            document.getElementById("totalCommands")
                .textContent = logs.length;


            const reports = logs.filter(
                log => log.commandName === "report"
            ).length;


            const statuses = logs.filter(
                log => log.commandName === "status"
            ).length;


            document.getElementById("reportCount")
                .textContent = reports;

            document.getElementById("statusCount")
                .textContent = statuses;


            /*
             * Empty state
             */

            if (logs.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="7" class="empty">
                            No commands received yet.
                        </td>
                    </tr>
                `;

                return;
            }


            /*
             * Clear existing table
             */

            table.innerHTML = "";


            /*
             * Add each log
             */

            logs.forEach(log => {

                const row = document.createElement("tr");


                const badgeClass =
                    log.commandName === "report"
                        ? "badge-report"
                        : "badge-status";


                row.innerHTML = `

                    <td>
                        ${escapeHtml(log.id)}
                    </td>

                    <td class="command">

                        <span class="badge ${badgeClass}">
                            /${escapeHtml(log.commandName)}
                        </span>

                    </td>

                    <td>
                        ${escapeHtml(log.userId)}
                    </td>

                    <td>
                        ${escapeHtml(log.channelId)}
                    </td>

                    <td>
                        ${escapeHtml(log.text || "-")}
                    </td>

                    <td class="action">
                        ${escapeHtml(log.actionTaken || "-")}
                    </td>

                    <td>
                        ${escapeHtml(
                            formatDate(log.createdAt)
                        )}
                    </td>

                `;


                table.appendChild(row);

            });


            /*
             * Show refresh time
             */

            document.getElementById("lastUpdated")
                .textContent =
                "Updated " +
                new Date().toLocaleTimeString();


        } catch (error) {

            message.innerHTML = `
                <div class="error">
                    Unable to load command logs.
                </div>
            `;

        }

    }


    /*
     * Load command configurations
     */
    async function loadConfigs() {

        const container =
            document.getElementById("configContainer");


        try {

            const response =
                await fetch("/api/admin/configs");


            if (!response.ok) {
                throw new Error(
                    "Failed to load configuration"
                );
            }


            const configs =
                await response.json();


            container.innerHTML = "";


            /*
             * No configurations
             */

            if (configs.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No command configuration found.
                    </div>
                `;

                return;
            }


            /*
             * Configuration cards
             */

            const grid =
                document.createElement("div");

            grid.className = "config-grid";


            configs.forEach(config => {

                const card =
                    document.createElement("div");

                card.className =
                    "config-card";


                card.innerHTML = `

                    <h4>
                        /${escapeHtml(config.commandName)}
                    </h4>


                    <div class="config-row">

                        <label class="checkbox-row">

                            <input
                                type="checkbox"
                                id="enabled-${escapeHtml(
                                    config.commandName
                                )}"
                                ${config.enabled ? "checked" : ""}
                            >

                            Enabled

                        </label>

                    </div>


                    <div class="config-row">

                        <label
                            class="config-label"
                            for="response-${escapeHtml(
                                config.commandName
                            )}">
                            Response Message
                        </label>

                        <input
                            class="response-input"
                            type="text"
                            id="response-${escapeHtml(
                                config.commandName
                            )}"
                            value="${escapeHtml(
                                config.responseMessage
                            )}"
                        >

                    </div>


                    <div class="config-row">

                        <label class="checkbox-row">

                            <input
                                type="checkbox"
                                id="mirror-${escapeHtml(
                                    config.commandName
                                )}"
                                ${config.mirrorEnabled ? "checked" : ""}
                            >

                            Mirror to Slack

                        </label>

                    </div>


                    <button
                        class="save-button"
                        onclick="saveConfig(
                            '${escapeHtml(
                                config.commandName
                            )}'
                        )">

                        Save

                    </button>


                    <span
                        class="save-status"
                        id="saved-${escapeHtml(
                            config.commandName
                        )}">

                    </span>

                `;


                grid.appendChild(card);

            });


            container.appendChild(grid);


        } catch (error) {

            container.innerHTML = `
                <div class="error">
                    Unable to load command configuration.
                </div>
            `;

        }

    }


    /*
     * Save command configuration
     */
    async function saveConfig(commandName) {

        const enabled =
            document.getElementById(
                `enabled-${commandName}`
            ).checked;


        const responseMessage =
            document.getElementById(
                `response-${commandName}`
            ).value;


        const mirrorEnabled =
            document.getElementById(
                `mirror-${commandName}`
            ).checked;


        const result =
            document.getElementById(
                `saved-${commandName}`
            );


        result.textContent = "Saving...";


        try {

            const response =
                await fetch(
                    `/api/admin/configs/${commandName}`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            enabled: enabled,

                            responseMessage:
                                responseMessage,

                            mirrorEnabled:
                                mirrorEnabled

                        })
                    }
                );


            if (!response.ok) {
                throw new Error(
                    "Configuration update failed"
                );
            }


            result.textContent = "Saved ✅";


            /*
             * Remove the success message
             * after a few seconds.
             */

            setTimeout(() => {

                result.textContent = "";

            }, 3000);


        } catch (error) {

            result.textContent = "Failed ❌";

        }

    }


    /*
     * Initial page load
     */

    loadLogs();

    loadConfigs();


    /*
     * Live log refresh
     * every 10 seconds.
     */

    setInterval(loadLogs, 10000);

</script>

</body>
</html>
