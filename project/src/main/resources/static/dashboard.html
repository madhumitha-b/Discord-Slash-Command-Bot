<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Discord Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .topbar {
            background: #1f2937;
            color: white;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topbar h1 {
            margin: 0;
            font-size: 22px;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            font-size: 13px;
            color: #d1d5db;
        }

        .logout {
            color: white;
            text-decoration: none;
            border: 1px solid #6b7280;
            padding: 8px 14px;
            border-radius: 6px;
        }

        .logout:hover {
            background: #374151;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .welcome {
            margin-bottom: 24px;
        }

        .welcome h2 {
            margin: 0 0 6px;
            font-size: 28px;
        }

        .welcome p {
            margin: 0;
            color: #6b7280;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            margin-bottom: 28px;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 22px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .card-title {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .logs-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .section-header {
            padding: 20px 22px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h3 {
            margin: 0;
            font-size: 18px;
        }

        .refresh-button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh-button:hover {
            background: #1d4ed8;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .command {
            font-weight: bold;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-status {
            background: #dcfce7;
            color: #166534;
        }

        .badge-report {
            background: #dbeafe;
            color: #1e40af;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            padding: 20px;
            color: #b91c1c;
            background: #fee2e2;
            margin: 20px;
            border-radius: 6px;
        }

        @media (max-width: 800px) {
            .cards {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 16px 20px;
            }

            .topbar h1 {
                font-size: 18px;
            }

            .welcome h2 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">
    <h1>Discord Admin Dashboard</h1>

    <div class="topbar-right">
        <span class="status" id="lastUpdated">Loading...</span>
        <a class="logout" href="/logout">Logout</a>
    </div>
</header>

<main class="container">

    <div class="welcome">
        <h2>Command Activity</h2>
        <p>Monitor Discord commands received by your application.</p>
    </div>

    <section class="cards">

        <div class="card">
            <div class="card-title">Total Commands</div>
            <div class="card-value" id="totalCommands">0</div>
        </div>

        <div class="card">
            <div class="card-title">Reports</div>
            <div class="card-value" id="reportCount">0</div>
        </div>

        <div class="card">
            <div class="card-title">Status Checks</div>
            <div class="card-value" id="statusCount">0</div>
        </div>

    </section>

    <section class="logs-section">

        <div class="section-header">
            <h3>Command Logs</h3>

            <button class="refresh-button" onclick="loadLogs()">
                Refresh
            </button>
        </div>

        <div id="message"></div>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Command</th>
                    <th>User</th>
                    <th>Channel</th>
                    <th>Text</th>
                    <th>Time</th>
                </tr>
                </thead>

                <tbody id="logs">
                </tbody>
            </table>
        </div>

    </section>

</main>

<script>

    function escapeHtml(value) {

        if (value === null || value === undefined) {
            return "";
        }

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(value) {

        if (!value) {
            return "";
        }

        const date = new Date(value);

        if (isNaN(date.getTime())) {
            return value;
        }

        return date.toLocaleString();
    }

    async function loadLogs() {

        const table = document.getElementById("logs");
        const message = document.getElementById("message");

        message.innerHTML = "";

        try {

            const response = await fetch("/api/admin/logs");

            if (!response.ok) {
                throw new Error("Failed to load logs");
            }

            const logs = await response.json();

            document.getElementById("totalCommands").textContent = logs.length;

            const reports = logs.filter(
                log => log.commandName === "report"
            ).length;

            const statuses = logs.filter(
                log => log.commandName === "status"
            ).length;

            document.getElementById("reportCount").textContent = reports;
            document.getElementById("statusCount").textContent = statuses;

            if (logs.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="6" class="empty">
                            No commands received yet.
                        </td>
                    </tr>
                `;

            } else {

                table.innerHTML = "";

                logs.forEach(log => {

                    const row = document.createElement("tr");

                    const badgeClass =
                        log.commandName === "report"
                            ? "badge-report"
                            : "badge-status";

                    row.innerHTML = `
                        <td>${escapeHtml(log.id)}</td>

                        <td class="command">
                            <span class="badge ${badgeClass}">
                                /${escapeHtml(log.commandName)}
                            </span>
                        </td>

                        <td>${escapeHtml(log.userId)}</td>

                        <td>${escapeHtml(log.channelId)}</td>

                        <td>${escapeHtml(log.text || "-")}</td>

                        <td>${escapeHtml(formatDate(log.createdAt))}</td>
                    `;

                    table.appendChild(row);
                });
            }

            document.getElementById("lastUpdated").textContent =
                "Updated " + new Date().toLocaleTimeString();

        } catch (error) {

            message.innerHTML = `
                <div class="error">
                    Unable to load command logs.
                </div>
            `;
        }
    }

    loadLogs();

    // Automatically refresh every 10 seconds
    setInterval(loadLogs, 10000);

</script>

</body>
</html>
